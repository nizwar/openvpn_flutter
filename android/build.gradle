group = 'id.laskarmedia.openvpn_flutter'
version = '2.0.1'

// The OpenVPN engine (ics-openvpn, OpenVPN 2.7 + OpenSSL 3.5, 16 KB page
// aligned native libraries) is built from https://github.com/nizwar/openvpn_library
// and served by JitPack. Pin a commit, never a branch, so every app builds the
// same engine.
def openvpnLibraryVersion = 'ccd61bc39b'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Only used when this module is built on its own; inside an app the
        // app's Android Gradle Plugin is used.
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

// JitPack hosts the engine. Added to every project because the dependency is
// resolved from the app module.
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'

android {
    namespace = 'id.laskarmedia.openvpn_flutter'
    compileSdk = 34

    defaultConfig {
        minSdk = 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    // The example app (and anyone developing the engine) can build the engine
    // from the openvpn_library submodule instead: its settings.gradle includes
    // it as :openvpn_library when the submodule is checked out.
    def localEngine = rootProject.findProject(':openvpn_library')
    if (localEngine != null) {
        implementation localEngine
    } else {
        implementation "com.github.nizwar:openvpn_library:${openvpnLibraryVersion}"
    }
}

// OpenVPN runs as its own process from libovpnexec.so, so the app has to
// extract its native libraries on install. Point it out at build time rather
// than with a VPN that exits right after connecting.
def appProject = rootProject.findProject(':app')
if (appProject != null) {
    def checkNativeLibraryExtraction = {
        try {
            def appAndroid = appProject.extensions.findByName('android')
            if (appAndroid == null) return
            def legacyPackaging = null
            try {
                legacyPackaging = appAndroid.packaging.jniLibs.useLegacyPackaging
            } catch (ignored) {
                legacyPackaging = appAndroid.packagingOptions.jniLibs.useLegacyPackaging
            }
            def minSdk = null
            try {
                minSdk = appAndroid.defaultConfig.minSdk
            } catch (ignored) {
            }
            def manifest = appAndroid.sourceSets.main.manifest.srcFile
            def manifestExtracts = manifest != null && manifest.exists() &&
                    manifest.text.contains('android:extractNativeLibs="true"')
            def extracts = legacyPackaging == Boolean.TRUE ||
                    (legacyPackaging == null && minSdk != null && minSdk < 23) || manifestExtracts
            if (!extracts) {
                logger.warn('openvpn_flutter: the app does not extract its native libraries, so the VPN ' +
                        'cannot start. Add this to the android block of android/app/build.gradle(.kts):\n' +
                        '    packaging { jniLibs { useLegacyPackaging = true } }')
            }
        } catch (Throwable ignored) {
            // Never fail a build over this check.
        }
    }
    if (appProject.state.executed) {
        checkNativeLibraryExtraction()
    } else {
        appProject.afterEvaluate { checkNativeLibraryExtraction() }
    }
}
