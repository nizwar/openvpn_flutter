name: openvpn_flutter
description: Connect to OpenVPN servers from Flutter on Android, iOS and macOS. Stage, traffic and log streams, per-app VPN, session timeouts, 16 KB page size ready.
version: 2.0.1
homepage: https://github.com/nizwar/openvpn_flutter
repository: https://github.com/nizwar/openvpn_flutter
issue_tracker: https://github.com/nizwar/openvpn_flutter/issues
funding:
  - https://paypal.me/nizwar
topics:
  - vpn
  - openvpn
  - network
  - security
  - privacy

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: id.laskarmedia.openvpn_flutter
        pluginClass: OpenVPNFlutterPlugin
      ios:
        pluginClass: OpenVPNFlutterPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: OpenVPNFlutterPlugin
        sharedDarwinSource: true
